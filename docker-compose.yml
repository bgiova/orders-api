services:
  postgres:
    image: postgres:16
    container_name: orders-postgres
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - '5433:5432'
    volumes:
      - orders_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: orders-redis
    ports:
      - '6379:6379'

volumes:
  orders_postgres_data:
